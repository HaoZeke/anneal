language = "C"
include_guard = "ANNEAL_CORE_H"
include_version = true
pragma_once = true
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. */"
after_includes = "#include <dlpack/dlpack.h>"
namespace = "anneal"
no_includes = false
cpp_compat = true
line_length = 80
tab_width = 4
braces = "SameLine"
documentation = true
documentation_style = "Doxy"
documentation_length = "full"
line_endings = "LF"

# The header is the C ABI in src/ffi.rs: the four anneal_* exports and the
# types they use. Rust constants are not part of that ABI, and cbindgen
# flattens same-named constants from different modules into one C scope.
# The excluded names are C imports (or, for SoapSpec, a type those
# constants mention), not symbols this crate exports.
[export]
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions"]
# The option structs carry these as int32_t, so that an unknown value is
# refused instead of undefined; no field names them, so list them here.
include = [
    "anneal_box_history_t",
    "anneal_box_membership_t",
    "anneal_box_visit_policy_t",
    "anneal_box_coverage_t",
]
exclude = [
    "gpr_version_components",
    "gpr_atoms_create_simple",
    "gpr_atoms_destroy",
    "gpr_model_create",
    "gpr_model_destroy",
    "gpr_model_config_defaults",
    "gpr_model_init",
    "gpr_model_train",
    "gpr_model_predict_full",
    "gpr_model_predict",
    "gpr_model_n_observations",
    "gpr_model_set_hssvd_backend",
    "gpr_model_get_hssvd_backend",
    "lammps_open_no_mpi",
    "lammps_close",
    "lammps_command",
    "lammps_scatter_atoms",
    "lammps_gather_atoms",
    "lammps_has_error",
    "lammps_get_last_error_message",
    "vesin_neighbors",
    "vesin_free",
    "libira_try_mat",
    "libira_match",
    "SoapSpec",
]
