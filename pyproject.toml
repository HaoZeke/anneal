[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "anneal"
description = "A package for various annealing and quenching techniques"
authors = [
    { name = "Rohit Goswami",   email = "rgoswami@ieee.org" },
    { name = "Ruhila S",         email = "ruhila@ieee.org" },
    { name = "Amrita Goswami",   email = "amrita@hi.is" },
    { name = "Sonaly Goswami",   email = "sonaly@iitk.ac.in" },
    { name = "Debabrata Goswami", email = "dgoswami@iitk.ac.in" },
]
maintainers = [
    { name = "Rohit Goswami", email = "rgoswami@ieee.org" },
    { name = "Ruhila S",       email = "ruhila@ieee.org" },
    { name = "Amrita Goswami", email = "amrita@hi.is" },
]
# [[[cog
# cog.outl('version = "%s"' % anneal_version.package_version())
# ]]]
version = "0.12.0"
# [[[end]]]
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
keywords = ["optimization", "algorithms", "simulated-annealing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "array-api-compat>=1.12",
    "numpy>=1.24.1",
]

# Python 3.10 has no tomllib. scripts/anneal_version.py falls back to tomli.
# https://peps.python.org/pep-0735/
[dependency-groups]
dev = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
plotter = ["matplotlib>=3.6.3"]
gpu = ["cupy-cuda12x>=13,<15"]
testing = ["pytest>=8", "pytest-cov>=4.1", "array-api-strict"]
ase = ["ase>=3.23,<3.30"]
cutest = [
    "cma>=4.4",
    "numpy>=1.24.1,<2",
    "pdfo>=2.1",
    "pycutest>=1.8.1,<2",
    "scipy>=1.11",
]

[project.urls]
"Homepage"   = "https://github.com/HaoZeke/anneal"
"Bug Tracker" = "https://github.com/HaoZeke/anneal/issues"

[tool.maturin]
# The wheel crate installs the rgpot kernels, which anneal-core cannot
# depend on from crates.io.
manifest-path = "crates/anneal-python/Cargo.toml"
features      = ["python"]
module-name   = "anneal._core"
python-source = "python"
# cargo resolves every path in the root manifest for any build: the
# [patch.crates-io] target and the optional nng crates the wheel does not
# enable. maturin packs neither.
include       = [
    { path = "vendor/metatensor-sys/**/*", format = "sdist" },
    { path = "vendor/nng/**/*", format = "sdist" },
    { path = "vendor/nng-sys/**/*", format = "sdist" },
]

[tool.pytest.ini_options]
markers = [
    "gpu: tests requiring a CUDA array backend",
]
