[project]
name = "rgpot"
# [[[cog import rgpot_version as v; cog.outl(f'version = "{v.VERSION}"')]]]
version = "3.7.0"
# [[[end]]]
description = "Potential energy surfaces for atomistic simulation (LJ + Metatomic multi-ABI dlopen; nanobind abi3)"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Rohit Goswami", email = "rgoswami@ieee.org" },
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["potential", "Lennard-Jones", "metatomic", "rgpot", "potlib", "dlopen", "nanobind", "abi3"]

[project.urls]
Homepage = "https://github.com/OmniPotentRPC/rgpot"
Repository = "https://github.com/OmniPotentRPC/rgpot"
Issues = "https://github.com/OmniPotentRPC/rgpot/issues"
Changelog = "https://github.com/OmniPotentRPC/rgpot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Runtime Python stack for the Metatomic engine (torch + metatomic from PyPI).
# The engine .so is built into the wheel; these packages provide the NEEDED libs.
# Bundled multi-ABI engines cover torch 2.7+ (see README).
metatomic = [
  "torch>=2.7",
  "metatensor-core>=0.1.0",
  "metatensor-torch>=0.6.0",
  "metatomic-torch>=0.1.0",
  # 0.6+ VesinOptions (skin/n_threads); must match engine build headers.
  "vesin>=0.6.0",
]
ase = ["ase>=3.23"]
test = ["pytest>=7", "numpy>=1.24", "hypothesis>=6", "pytest-timeout>=2"]

[build-system]
requires = [
  "meson-python>=0.16",
  "meson>=1.3",
  "ninja",
  "nanobind>=3.1",
  "numpy>=1.24",
  # Build-time for libmetatomic_engine.so (same purelib layout at runtime).
  # Multi-ABI pack targets torch 2.7+; older majors are not shipped.
  "torch>=2.7",
  "metatensor-core",
  "metatensor-torch",
  "metatomic-torch",
  "vesin>=0.6.0",
]
build-backend = "mesonpy"

# The abi3 wheel tag is a declaration, not a detection: meson-python names
# the wheel abi3 only when this is set, no matter that the module builds as
# _core.abi3.so. Reverted automatically wherever the build passes
# -Dpython.allow_limited_api=false (the cp310/cp311 cibuildwheel override).
[tool.meson-python]
limited-api = true

# Wheel keeps dlopen Metatomic path: engine plugin + thin frontend (not LJ-only).
[tool.meson-python.args]
setup = [
  "-Dwith_python=true",
  "-Dwith_rpc=false",
  "-Dwith_rpc_client_only=false",
  "-Dwith_tests=false",
  "-Dwith_examples=false",
  # The eight Fortran 2018 kernels (SW, EDIP, Lenosky, Tersoff, EAM-Al,
  # FeHe, CuH2, TIP4P-H). Without this the wheel ships a librgpot with no
  # Fortran-backed potentials at all -- the pots this library exists to
  # host. Needs a Fortran compiler in the wheel build environment; the
  # repair step vendors libgfortran into the wheel like any other
  # dependency.
  "-Dwith_fortran_pots=enabled",
  "-Dwith_metatomic=true",
  "-Dwith_xtb=false",
  "-Dwith_xckernel=true",
  "-Dwith_dftd3=true",
  "-Dwith_dftd4=true",
  "-Dlapack=openblas",
  "-Dwith_expr=true",
  "-Dwith_tblite=false",
  "-Dwith_rust_core=false",
  "-Dwith_cache=false",
  "-Dwith_eigen=false",
  "-Db_lto=false",
]
install = ["--skip-subprojects"]
dist = ["--include-subprojects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "thread_unsafe: mutates process-wide thread state (OpenMP or a pool)",
  "iterations: pytest-run-parallel repeat count for one test",
]

[[tool.mypy.overrides]]
module = ["ase.*", "capnp", "anneal", "torch", "torch.*"]
ignore_missing_imports = true

# nanobind.stubgen writes tuple and dict without parameters. The file is
# checked by diff against a fresh stubgen, so it is not hand-edited.
[[tool.mypy.overrides]]
module = ["rgpot._core"]
ignore_errors = true

# ASE's own methods are untyped. The calculator still has to call them.
[[tool.mypy.overrides]]
module = ["rgpot.ase", "rgpot.ase.*"]
disallow_untyped_calls = false
warn_return_any = false

[tool.cibuildwheel]
# manylinux images carry gcc/g++ but not gfortran, and the Fortran kernels
# are part of the library's point.
build-frontend = "build"
# cp312 is the stable-ABI build: meson gates Py_LIMITED_API on build
# Python >= 3.12, and tool.meson-python.limited-api turns that into a
# cp312-abi3 tag covering every 3.12+ CPython. cp310/cp311 build native
# wheels with the limited API switched off via the override below.
# cp315t is omitted: the isolated build requires torch, and PyPI has no
# torch wheel for that tag. The reduced meson job still tests 3.15t.
build = "cp310-* cp311-* cp312-* cp314t-*"
skip = ["pp*", "*-musllinux*", "*_i686", "*-win32"]
# Prove the kernels are in the artifact rather than trusting the flag: a
# wheel whose librgpot has no bind(c) entry points is the bug 3.0.1 fixed.
# The pytest run checks the repaired wheel's runpath, its import without
# LD_LIBRARY_PATH and its abi3 tag.
test-command = "python -c \"import rgpot; assert rgpot.has_expr and rgpot.has_dftd3 and rgpot.has_dftd4 and rgpot.has_xckernel, (rgpot.has_expr, rgpot.has_dftd3, rgpot.has_dftd4, rgpot.has_xckernel); print(rgpot.__file__, len(rgpot.XcKernel.catalog()))\" && python -m pytest -q tests/test_rgpot_pip_core.py"
test-requires = ["pytest", "numpy"]
test-sources = ["tests/test_rgpot_pip_core.py"]

# meson skips the limited_api kwarg under these interpreters anyway; the
# explicit -D flag makes meson-python drop the abi3 tag to match.
# Free-threaded CPython before 3.15 also rejects the limited API, so
# cp314t is in this list.
[[tool.cibuildwheel.overrides]]
select = "cp310-* cp311-* cp314t-*"
config-settings = "setup-args=-Dpython.allow_limited_api=false"

[tool.cibuildwheel.linux]
# openblas-devel is libopenblas; dftd4 is configured with lapack=openblas.
# An AlmaLinux mirror can serve an empty repomd.xml, so the install retries
# on fresh metadata and stops the job if it never succeeds; otherwise the
# build ran on and failed later on a missing openblas. The mirrorlist can
# hand the runner the same broken mirror on every attempt, so the retries
# read the primary repo.almalinux.org that each repo file names in its
# commented baseurl.
before-all = """
set -eu
pm=$(command -v dnf || command -v yum)
for attempt in 1 2 3; do
  "$pm" install -y gcc-gfortran openblas-devel && break
  if [ "$attempt" -eq 3 ]; then
    echo "gcc-gfortran and openblas-devel did not install after 3 attempts" >&2
    exit 1
  fi
  for repo in /etc/yum.repos.d/almalinux*.repo; do
    [ -f "$repo" ] || continue
    sed -i -e 's|^mirrorlist=|#mirrorlist=|' -e 's|^# *baseurl=https://repo.almalinux.org/|baseurl=https://repo.almalinux.org/|' "$repo"
  done
  "$pm" clean metadata
  sleep $((attempt * 20))
done
rpm -q gcc-gfortran openblas-devel
g++ -std=c++20 -ICppCore CppCore/tests/print_cxx_layout_stamp.cc -o /tmp/print_cxx_layout_stamp
/tmp/print_cxx_layout_stamp
"""
# meson-python vendors librgpot into .rgpot.mesonpy.libs and rewrites RPATHs,
# but auditwheel still resolves NEEDED against the filesystem. Unpack the
# wheel and put that directory on LD_LIBRARY_PATH.
#
# Torch / metatomic / metatensor are runtime deps of the Metatomic engine
# plugin (dlopen / RPATH). Do not vendor them into the wheel — exclude so
# auditwheel leaves those NEEDED entries for the installed torch stack.
# libgomp stays in: torch wheels carry their own renamed copy, which does not
# answer librgpot's NEEDED libgomp.so.1, so excluding it left plain installs
# depending on a system OpenMP runtime.
repair-wheel-command = """
  set -eu
  # mesonpy zip drops ELF soversion links; _core NEEDs librgpot.so.N
  # (N is kCxxSoversion). rgpot_repair_wheel.sh copies that SONAME.
  bash scripts/rgpot_repair_wheel.sh "{wheel}"
  tmp=$(mktemp -d)
  unzip -q "{wheel}" -d "$tmp"
  libdir=$(dirname "$(find "$tmp" -name 'librgpot.so*' | head -1)")
  test -n "$libdir"
  LD_LIBRARY_PATH="$libdir:${LD_LIBRARY_PATH:-}" \
    auditwheel repair -w {dest_dir} "{wheel}" \
      --exclude libtorch.so \
      --exclude libtorch_cpu.so \
      --exclude libc10.so \
      --exclude libtorch_python.so \
      --exclude libmetatensor_torch.so \
      --exclude libmetatomic_torch.so \
      --exclude libmetatensor.so
  rm -rf "$tmp"
  # auditwheel rewrites NEEDED on librgpot.so.<version> only. Recopy that
  # file onto librgpot.so.<soversion>, which _core actually loads.
  for w in {dest_dir}/*.whl; do
    bash scripts/rgpot_repair_wheel.sh --refresh-soname "$w"
  done
"""

[tool.cibuildwheel.macos]
# Homebrew on the macos-15 runner builds libgfortran, libquadmath,
# OpenBLAS and libomp for macOS 15.0. delocate 0.13 rejects those
# libraries under a 14.0 target, and the wheel tag follows the target
# (macosx_15_0). The bind and rust-core template wheels stay at 14.0:
# they do not vendor those runtimes.
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0", PKG_CONFIG_PATH = "/opt/homebrew/opt/openblas/lib/pkgconfig" }
before-all = """
brew list gcc >/dev/null 2>&1 || brew install gcc
brew list openblas >/dev/null 2>&1 || brew install openblas
c++ -std=c++20 -ICppCore CppCore/tests/print_cxx_layout_stamp.cc -o /tmp/print_cxx_layout_stamp && /tmp/print_cxx_layout_stamp
"""
# Same librgpot search-path story as Linux. Exclude torch/metatomic dylibs:
# they ship with the pip torch / metatomic-torch wheels, not inside rgpot.
repair-wheel-command = """
  set -eu
  tmp=$(mktemp -d)
  unzip -q "{wheel}" -d "$tmp"
  libdir=$(dirname "$(find "$tmp" -name 'librgpot*.dylib' | head -1)")
  DYLD_LIBRARY_PATH="$libdir:${DYLD_LIBRARY_PATH:-}" \
    delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v "{wheel}" \
      --ignore-missing-dependencies \
      --exclude libtorch \
      --exclude libtorch_cpu \
      --exclude libc10 \
      --exclude libtorch_python \
      --exclude libmetatensor_torch \
      --exclude libmetatomic_torch \
      --exclude libmetatensor
  rm -rf "$tmp"
"""
