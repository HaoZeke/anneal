[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "anneal"
description = "A package for various annealing and quenching techniques"
authors = [
    { name = "Rohit Goswami",   email = "rgoswami@ieee.org" },
    { name = "Ruhila S",         email = "ruhila@ieee.org" },
    { name = "Amrita Goswami",   email = "amrita@hi.is" },
    { name = "Sonaly Goswami",   email = "sonaly@iitk.ac.in" },
    { name = "Debabrata Goswami", email = "dgoswami@iitk.ac.in" },
]
maintainers = [
    { name = "Rohit Goswami", email = "rgoswami@ieee.org" },
    { name = "Ruhila S",       email = "ruhila@ieee.org" },
    { name = "Amrita Goswami", email = "amrita@hi.is" },
]
version = "0.4.0"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
keywords = ["optimization", "algorithms", "simulated-annealing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "array-api-compat>=1.12",
    "numpy>=1.24.1",
]

[project.optional-dependencies]
plotter = ["matplotlib>=3.6.3"]
gpu = ["cupy-cuda12x>=13,<15"]
testing = ["pytest>=8", "pytest-cov>=4.1"]
cutest = [
    "cma>=4.4",
    "numpy>=1.24.1,<2",
    "pdfo>=2.1",
    "pycutest>=1.8.1,<2",
    "scipy>=1.11",
]

[project.urls]
"Homepage"   = "https://github.com/HaoZeke/anneal"
"Bug Tracker" = "https://github.com/HaoZeke/anneal/issues"

[tool.maturin]
features      = ["python"]
module-name   = "anneal._core"
python-source = "python"

[tool.pytest.ini_options]
markers = [
    "gpu: tests requiring a CUDA array backend",
]
