[package]
name = "anneal-core"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Simulated annealing components built on the eindir typed primitives."
repository = "https://github.com/HaoZeke/anneal"
categories = ["science", "mathematics"]
keywords = ["optimization", "simulated-annealing", "metaheuristic"]

[lib]
name = "anneal_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
capi = []
python = ["dep:pyo3", "dep:numpy", "dlpk/pyo3", "eindir-core/python"]

[dependencies]
thiserror   = "2"
ndarray     = "0.17"
dlpk        = { git = "https://github.com/metatensor/dlpk.git", tag = "v0.1.5", features = ["ndarray", "half"] }
eindir-core = { git = "https://github.com/HaoZeke/eindir.git", rev = "551130c3500badf6221bfa2cbee0b3648bd0009a" }
num-traits  = "0.2"
rand        = "0.9"
rand_distr  = "0.5"
pyo3        = { version = "0.26", features = ["extension-module", "abi3-py310"], optional = true }
numpy       = { version = "0.26", optional = true }

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }
proptest  = "1"

[build-dependencies]
cbindgen = "0.29"

[package.metadata.capi]
min_version = "0.10.17"

[package.metadata.capi.header]
name         = "anneal-core.h"
subdirectory = ""
generation   = true
enabled      = true

[package.metadata.capi.pkg_config]
name        = "anneal-core"
filename    = "anneal-core"
description = "Simulated annealing components on the eindir typed primitives"

[package.metadata.capi.library]
name = "anneal_core"

[package.metadata.capi.install.include]
asset = [{ from = "include/anneal-core.hpp", to = "." }]

[profile.dist]
inherits = "release"
lto      = "thin"

[[bench]]
name    = "sa_bench"
harness = false
