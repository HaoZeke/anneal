[workspace]
# The root package is the member. `members = ["."]` is a prefix of every
# path under the root, which would mark the vendored crates as explicit
# members and defeat `exclude`. Edition 2024 already selects the resolver;
# an explicit `resolver = "2"` would change it.
# Vendored path dependencies live in this tree. Cargo would otherwise adopt
# them as workspace members, and `cargo fmt --all` would rewrite them with
# stable rustfmt.
exclude = ["vendor/nng", "vendor/nng-sys", "vendor/metatensor-sys"]

[package]
name = "anneal-core"
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Simulated annealing components built on the eindir typed primitives."
repository = "https://github.com/HaoZeke/anneal"
categories = ["science", "mathematics"]
keywords = ["optimization", "simulated-annealing", "metaheuristic"]
# Development pins and the out-of-tree target directory. The published
# crate resolves registry versions.
exclude = [".cargo/config.toml"]

[lib]
name = "anneal_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Shape matching through the IRA Fortran library. Needs libira on the link
# path; set IRA_LIB_DIR when building.
ira = []
# In-process MD segments through the LAMMPS C library. Needs liblammps on
# the link path via LAMMPS_LIB_DIR.
lammps = []
# Exact basin identity by canonical contact-graph labelling through nauty.
graphkey = ["dep:petgraph", "dep:nauty-pet"]
# featomic SOAP power spectrum leftover. Off by default because the
# metatensor C core is built from source by cmake.
featomic = ["dep:featomic", "dep:metatensor"]
# Neighbour construction through the vesin cell lists.
vesin-nl = []
# Cap'n Proto shared bank. Chains are separate processes.
bank-rpc = ["dep:capnp", "dep:capnp-rpc", "dep:futures", "dep:nng", "dep:tokio", "dep:tokio-util", "dep:libc", "rgsaddle"]
# REQ/REP transport for MinimumHistory. Independent of catalog/census.
history-nng = ["dep:nng"]
# Minimum-saddle-minimum sessions, stationary-index checks, the
# constant-energy (NVE) minima-hopping escape, and the dense symmetric
# eigensolve used by a connected spectral split. Off by default. `python`
# and `bank-rpc` turn it on. The feature compiles rgsaddle 0.3.0 from
# crates.io against rgmin 0.5.0.
rgsaddle = ["dep:rgsaddle"]
# The gradient-enhanced Gaussian process of gpr_optim, over its C API. Needs
# libgpr_optim on the link path; set GPR_OPTIM_LIB_DIR when building.
gpr = []
capi = ["eindir-core/capi"]
python = ["dep:pyo3", "dep:numpy", "dlpk/pyo3", "eindir-core/py-objective", "rgsaddle"]
# Examples using an in-process rgpot eindir handle (xtb / CuH2 via
# libloading). Off by default so LJ builds do not pull rgpot-core.
# Do not enable rgpot-core/rpc: that needs a host capnp compiler.
rgpot-ex = ["dep:rgpot-core", "dep:libloading"]

[dependencies]
petgraph = { version = "0.8", optional = true }
nauty-pet = { version = "0.14", optional = true }

thiserror   = "2"
ndarray     = "0.17"
dlpk        = { version = "0.1.5", features = ["ndarray", "half"] }
# Published 0.3.11 is the previous git pin, sources included.
linkcell    = { version = "=0.3.11", default-features = false }
# eindir-core 0.6.0 on crates.io matches the previous git pin's sources.
eindir-core = { version = "0.6.0", features = ["capi"] }
rgmin = "0.5.0"
rgsaddle = { version = "0.3.0", optional = true }
readcon-core = "=0.14.8"
readcon-db = "=0.1.5"
num-traits  = "0.2"
rand        = "0.9"
rand_distr  = "0.5"
rayon       = "1.10"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
sha2        = "0.10"
pyo3        = { version = "0.26", features = ["extension-module", "abi3-py310"], optional = true }
numpy       = { version = "0.26", optional = true }
# Registry 3.5.1 depends on eindir-core 0.6.0, the same crate the rest of
# the workspace uses. A git pin of 3.0.2 packages as registry 3.0.2, and
# that release depends on eindir-core 0.5.2.
rgpot-core = { version = "=3.5.1", optional = true }
libloading = { version = "0.8", optional = true }
capnp = { version = "0.21", optional = true }
capnp-rpc = { version = "0.21", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "net", "rt", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
nng = { version = "1.0", path = "vendor/nng", optional = true }
libc = { version = "0.2", optional = true }
# SOAP power spectrum leftover. featomic 0.6 carries ndarray 0.16;
# descriptor data crosses as f64 slices. metatensor-static embeds the
# C core so SLURM tasks do not need LD_LIBRARY_PATH.
featomic   = { version = "0.6.0", features = ["metatensor-static"], optional = true }
metatensor = { version = "=0.2.3", optional = true }

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }
proptest  = "1"
trybuild  = "1.0"
tempfile = "3"
capnp = "0.21"
capnp-rpc = "0.21"
futures = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }

[build-dependencies]
cbindgen = "0.29"
cc = "1"

[package.metadata.capi]
min_version = "0.10.17"

[package.metadata.capi.header]
name         = "anneal-core.h"
subdirectory = ""
generation   = true
enabled      = true

[package.metadata.capi.pkg_config]
name        = "anneal-core"
filename    = "anneal-core"
description = "Simulated annealing components on the eindir typed primitives"

[package.metadata.capi.library]
name = "anneal_core"

[package.metadata.capi.install.include]
# dlpack.h is DLPack 1.3, the header dlpk 0.1.5 was translated from.
# `to = "dlpack"` installs it as include/dlpack/dlpack.h, which is what
# anneal-core.h includes, and what `pkg-config --cflags` puts on the
# compiler's search path.
asset = [
    { from = "include/anneal-core.hpp", to = "." },
    { from = "include/dlpack/dlpack.h", to = "dlpack" },
]

[profile.dist]
inherits = "release"
lto      = "thin"

[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[[bench]]
name    = "sa_bench"
harness = false

[[bench]]
name    = "tensor_id_bench"
harness = false

