[package]
name = "anneal-core"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Simulated annealing components built on the eindir typed primitives."
repository = "https://github.com/HaoZeke/anneal"
categories = ["science", "mathematics"]
keywords = ["optimization", "simulated-annealing", "metaheuristic"]

[lib]
name = "anneal_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
capi = []
python = ["dep:pyo3", "dep:numpy", "dlpk/pyo3", "eindir-core/py-objective"]

[dependencies]
thiserror   = "2"
ndarray     = "0.17"
dlpk        = { version = "0.1.5", features = ["ndarray", "half"] }
eindir-core = { version = "0.5.1" }
num-traits  = "0.2"
rand        = "0.9"
rand_distr  = "0.5"
pyo3        = { version = "0.26", features = ["extension-module", "abi3-py310"], optional = true }
numpy       = { version = "0.26", optional = true }

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }
proptest  = "1"
# Example/integration demo only: minimize an rgpot potential with anneal. Shares
# the same registry eindir-core + dlpk versions, so one eindir-core compilation
# backs both.
rgpot-core = { version = "2.2.0" }

[build-dependencies]
cbindgen = "0.29"

[package.metadata.capi]
min_version = "0.10.17"

[package.metadata.capi.header]
name         = "anneal-core.h"
subdirectory = ""
generation   = true
enabled      = true

[package.metadata.capi.pkg_config]
name        = "anneal-core"
filename    = "anneal-core"
description = "Simulated annealing components on the eindir typed primitives"

[package.metadata.capi.library]
name = "anneal_core"

[package.metadata.capi.install.include]
asset = [{ from = "include/anneal-core.hpp", to = "." }]

[profile.dist]
inherits = "release"
lto      = "thin"

[[bench]]
name    = "sa_bench"
harness = false

# Until eindir-core 0.5.1 reaches crates.io (tag v0.5.1 releases it), patch every
# consumer (anneal, rgpot-core) to the same git revision so one compilation backs both.
[patch.crates-io]
eindir-core = { git = "https://github.com/HaoZeke/eindir", rev = "5c962fa" }
