[package]
name = "anneal-core"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Simulated annealing components built on the eindir typed primitives."
repository = "https://github.com/HaoZeke/anneal"
categories = ["science", "mathematics"]
keywords = ["optimization", "simulated-annealing", "metaheuristic"]

[lib]
name = "anneal_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Shape matching through the IRA Fortran library. Needs libira on the link
# path; set IRA_LIB_DIR when building.
ira = []
# In-process MD segments through the LAMMPS C library. Needs liblammps on
# the link path via LAMMPS_LIB_DIR.
lammps = []
# Exact basin identity by canonical contact-graph labelling through nauty.
graphkey = ["dep:petgraph", "dep:nauty-pet"]
# featomic SOAP power spectrum leftover. Off by default because the
# metatensor C core is built from source by cmake.
featomic = ["dep:featomic", "dep:metatensor"]
# Neighbour construction through the vesin cell lists.
vesin-nl = []
# Cap'n Proto shared bank. Chains are separate processes.
bank-rpc = ["dep:capnp", "dep:nng"]
capi = ["eindir-core/capi"]
python = ["dep:pyo3", "dep:numpy", "dlpk/pyo3", "eindir-core/py-objective"]
# Examples using an in-process rgpot eindir handle (xtb / CuH2 via
# libloading). Off by default so LJ builds do not pull rgpot-core.
# Do not enable rgpot-core/rpc: that needs a host capnp compiler.
rgpot-ex = ["dep:rgpot-core", "dep:libloading"]

[dependencies]
petgraph = { version = "0.8", optional = true }
nauty-pet = { version = "0.14", optional = true }

thiserror   = "2"
ndarray     = "0.17"
dlpk        = { version = "0.1.5", features = ["ndarray", "half"] }
# Sibling checkouts provide the local development surface; the Git revisions
# are the reproducible source selected when this crate is consumed elsewhere.
eindir-core = { git = "https://github.com/HaoZeke/eindir.git", rev = "f3c42130bb389ba6cd6e4cfdc8b2e182f4a764e9", version = "0.6.0", features = ["capi"] }
xtsci-optimize = { git = "https://github.com/HaoZeke/xtsci-optimize.git", rev = "73c9788ddf15291af9ef072bc734196def2ff290", version = "0.2.0" }
num-traits  = "0.2"
rand        = "0.9"
rand_distr  = "0.5"
rayon       = "1.10"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
pyo3        = { version = "0.26", features = ["extension-module", "abi3-py310"], optional = true }
numpy       = { version = "0.26", optional = true }
# Only examples/molecular_cluster, slab_adsorption, and rgpot_minimize.
rgpot-core = { version = "=3.0.2", git = "https://github.com/HaoZeke/potlib.git", rev = "b1baa1b68a46143ad49bf4860728d779b76a647c", optional = true }
libloading = { version = "0.8", optional = true }
capnp = { version = "0.21", optional = true }
nng = { version = "1.0", optional = true }
# SOAP power spectrum leftover. featomic 0.6 carries ndarray 0.16;
# descriptor data crosses as f64 slices. metatensor-static embeds the
# C core so SLURM tasks do not need LD_LIBRARY_PATH.
featomic   = { version = "0.6.0", features = ["metatensor-static"], optional = true }
metatensor = { version = "=0.2.3", optional = true }

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }
proptest  = "1"
trybuild  = "1.0"
readcon-core = "=0.14.7"

[build-dependencies]
cbindgen = "0.29"
cc = "1"

[package.metadata.capi]
min_version = "0.10.17"

[package.metadata.capi.header]
name         = "anneal-core.h"
subdirectory = ""
generation   = true
enabled      = true

[package.metadata.capi.pkg_config]
name        = "anneal-core"
filename    = "anneal-core"
description = "Simulated annealing components on the eindir typed primitives"

[package.metadata.capi.library]
name = "anneal_core"

[package.metadata.capi.install.include]
asset = [{ from = "include/anneal-core.hpp", to = "." }]

[profile.dist]
inherits = "release"
lto      = "thin"

[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[[bench]]
name    = "sa_bench"
harness = false

[[example]]
name = "rgpot_minimize"
required-features = ["capi", "rgpot-ex"]

[[example]]
name = "molecular_cluster"
required-features = ["rgpot-ex", "featomic", "bank-rpc"]

[[example]]
name = "slab_adsorption"
required-features = ["rgpot-ex", "featomic", "bank-rpc"]

[[example]]
name = "bank_server"
required-features = ["bank-rpc"]

[[example]]
name = "bank_peek"
required-features = ["bank-rpc"]

[[example]]
name = "catalog_server"
required-features = ["bank-rpc"]

[[example]]
name = "ttt_lj38"
required-features = []

[[example]]
name = "catalog_journal_scan"
required-features = ["bank-rpc"]

[[example]]
name = "decaf_packing_separator"
required-features = []

[[example]]
name = "decaf_packing_grain"
required-features = []

[[example]]
name = "catalog_leave_audit"
required-features = ["bank-rpc"]

[[example]]
name = "catalog_journal_minima"
required-features = ["bank-rpc"]

[[example]]
name = "catalog_status"
required-features = ["bank-rpc"]

[[example]]
name = "decaf_local_classes"
required-features = ["bank-rpc"]

[[example]]
name = "occupancy_landfold_book"
required-features = ["featomic"]

[[example]]
name = "lj_census_calibration"
required-features = ["ira"]

