[package]
name = "anneal-core"
version = "0.7.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Simulated annealing components built on the eindir typed primitives."
repository = "https://github.com/HaoZeke/anneal"
categories = ["science", "mathematics"]
keywords = ["optimization", "simulated-annealing", "metaheuristic"]

[lib]
name = "anneal_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Shape matching through the IRA Fortran library. Needs libira on the link
# path; set IRA_LIB_DIR when building.
ira = []
# Morphology collective variables through featomic's spherical expansion and
# SOAP power spectrum. Off by default because featomic pulls the metatensor C
# core, which is built from source by cmake and roughly triples a cold build.
featomic = ["dep:featomic", "dep:metatensor"]
# The gradient-enhanced Gaussian process of gpr_optim, over its C API. Needs
# libgpr_optim on the link path; set GPR_OPTIM_LIB_DIR when building.
gpr = []
capi = ["eindir-core/capi"]
python = ["dep:pyo3", "dep:numpy", "dlpk/pyo3", "eindir-core/py-objective"]

[dependencies]
thiserror   = "2"
ndarray     = "0.17"
dlpk        = { version = "0.1.5", features = ["ndarray", "half"] }
eindir-core = { version = "0.5.2" }
num-traits  = "0.2"
rand        = "0.9"
rand_distr  = "0.5"
rayon       = "1.10"
pyo3        = { version = "0.26", features = ["extension-module", "abi3-py310"], optional = true }
numpy       = { version = "0.26", optional = true }
# Spherical expansion and SOAP power spectrum. featomic carries its own
# ndarray 0.16, so the two ndarray versions coexist and descriptor data crosses
# the boundary as f64 slices rather than as array types.
# metatensor-static links the metatensor C core into the binary. Without it
# metatensor-sys emits a libmetatensor.so carrying no rpath, so the example dies
# at startup on any machine where LD_LIBRARY_PATH was not set by hand, which is
# every SLURM array task.
featomic    = { version = "0.6.0", features = ["metatensor-static"], optional = true }
# Not called from this crate; declared to hold metatensor at the last version
# built on ndarray 0.16. metatensor 0.2.4 moved to 0.17 while featomic 0.6.0
# still asks for 0.16, and the two meet inside featomic, which then fails to
# compile with "multiple different versions of crate ndarray". Lift the pin
# when featomic publishes a release built on ndarray 0.17.
metatensor  = { version = "=0.2.3", optional = true }

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }
proptest  = "1"
trybuild  = "1.0"
# Example/integration demo only: minimize an rgpot potential with anneal. Shares
# the same registry eindir-core + dlpk versions, so one eindir-core compilation
# backs both.
rgpot-core = { version = "2.2.0" }

[build-dependencies]
cbindgen = "0.29"

[package.metadata.capi]
min_version = "0.10.17"

[package.metadata.capi.header]
name         = "anneal-core.h"
subdirectory = ""
generation   = true
enabled      = true

[package.metadata.capi.pkg_config]
name        = "anneal-core"
filename    = "anneal-core"
description = "Simulated annealing components on the eindir typed primitives"

[package.metadata.capi.library]
name = "anneal_core"

[package.metadata.capi.install.include]
asset = [{ from = "include/anneal-core.hpp", to = "." }]

[profile.dist]
inherits = "release"
lto      = "thin"

[[bench]]
name    = "sa_bench"
harness = false

[[example]]
name = "rgpot_minimize"
required-features = ["capi"]
