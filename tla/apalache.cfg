\* Apalache-friendly configuration. Drives the WorkflowApalache wrapper which
\* imports the Workflow spec via INSTANCE WITH-substitution for the operator
\* constants Cool / Neigh / Cost (Apalache's ConfigurationPass cannot perform
\* TLC-style operator replacements directly). Verified safety invariants only;
\* liveness checks belong in TLC.

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    BestMonotone

CONSTRAINT
    BoundedHistory

CONSTANTS
    S = {s1, s2, s3, s4, s5}
    T_0 = 10
    MaxSteps = 6
