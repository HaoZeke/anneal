\* Parameterized Apalache configuration. Larger |S|, generic Cost,
\* checks all four safety invariants and both liveness properties.

SPECIFICATION Spec

INVARIANTS
    TypeOK
    BestMonotone
    SymmetricNeighbors
    MonotoneCooling

PROPERTIES
    EventualTermination
    EventualCooling

CONSTANTS
    S = {s1, s2, s3, s4, s5, s6, s7, s8, s9, s10}
    T_0 = 100
    MaxSteps = 12
    Cool <- StepCool
    Neigh <- TrivialNeigh
    Cost <- TrivialCost
