baseline = "x86-64"

# The dispatch fixtures have no entry for their clones: the auditor has to
# prove them. GCC's fixtures import libgcc's CPU model; Clang's link its
# initialiser in.
[[allow]]
symbol = '^__cpu_indicator_init$'
features = ["xsave"]
reason = "libgcc __builtin_cpu_supports initializer; xgetbv reads XCR0"
