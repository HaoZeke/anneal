  "fma",
  "bmi1",
  "bmi2",
  "lzcnt",
  "xsave",
]
reason = "libquadmath, vendored beside libgfortran"

[[allow]]
symbol = '^(rgpot::simd::exact_fma_hw|rgpot::nlist::_GLOBAL__N_[0-9]+::fold_hardware)\b|rgpot::nlist::CachedPairList::accumulateHw<'
features = ["avx", "fma", "sse3"]
reason = "FMA bodies selected when the processor's FMA is usable"

# The FMA probe and libgcc's CPU model (linked in for the target_clones
# resolvers) read XCR0 after CPUID reports OSXSAVE.
[[allow]]
symbol = '^(rgpot::simd::detail::cpuid_fma_usable(\(\))?|__cpu_indicator_init)$'
features = ["xsave"]
reason = "xgetbv in CPU feature probes, run after the OSXSAVE bit"
