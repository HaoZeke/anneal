  "avx512dq",
  "avx512bw",
  "fma4",
  "xsave",
  "lse",
  "dotprod",
  "sve",
  "sve2",
  "fp16",
  "rcpc",
]
reason = "gfortran matmul runtime variants"

[[vendored]]
path = ".*libgomp.*"
features = [
  "sse3",
  "ssse3",
  "sse4_1",
  "sse4_2",
  "popcnt",
  "avx",
  "avx2",
  "fma",
  "rtm",
  "hle",
