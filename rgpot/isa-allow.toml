# An above-baseline instruction in librgpot or _core is a violation
# unless an [[allow]] names that symbol or the auditor proves the function
# is a dispatched clone (ci/isa-audit/dispatch.py): a local function that
# is entered only behind a __cpu_model test or from a target_clones
# resolver. Those clones (the AVX2 Lennard-Jones, Morse and Gupta bodies,
# the exp_fixed_n clones) need no entry here.
#
# The entries below are the bodies the proof cannot see. The Highway
# target("fma") helpers are exported, and they and the FMA fold are
# entered only after fma_hw_active(), a cached flag rather than a CPU
# model bit.
# Vendored entries cover libraries that auditwheel or delocate copy into
# the wheel and that select kernels at run time. A feature not listed
# here still fails the audit.

baseline = "x86-64"

[[allow]]
symbol = "^rgpot::simd::(?:accept_row_hw|eam_fma|eam_hw|exact_fma_hw|exp2_hw|exp_hw_n|lj_hw_span|lj_hw|morse8_hw|morse_hw|r2_hw_n|r2_hw)(?:\\(|$)"
features = ["avx", "fma"]
reason = "target(\"fma\") bodies, entered only after glibc_fma_active()"

[[allow]]
symbol = "^__cpu_indicator_init(?:\\(|$)"
features = ["xsave"]
reason = "GCC __builtin_cpu_supports initializer; xgetbv reads XCR0"

[[vendored]]
path = ".*libopenblas.*"
features = [
  "sse3",
  "ssse3",
  "sse4_1",
  "sse4_2",
  "popcnt",
  "avx",
  "avx2",
  "fma",
  "f16c",
  "bmi1",
  "bmi2",
  "lzcnt",
  "avx512f",
  "avx512vl",
  "avx512dq",
  "avx512bw",
  "avx512cd",
  "avx512_vnni",
  "avx512_bf16",
  "avx512_vpopcntdq",
  "avx512_ifma",
  "avx512_vbmi",
  "avx512_vbmi2",
  "fma4",
  "xop",
  "sse4a",
  "prefetchw",
  "d3now",
  "xsave",
  "lse",
  "dotprod",
  "i8mm",
  "bf16",
  "fcma",
  "sve",
  "sve2",
  "sme",
  "crc32",
  "aes",
  "sha1",
  "sha2",
  "pmull",
  "fp16",
  "rdm",
  "rcpc",
]
reason = "DYNAMIC_ARCH"

[[vendored]]
path = ".*libgfortran.*"
features = [
  "sse3",
  "ssse3",
  "sse4_1",
  "sse4_2",
  "popcnt",
  "avx",
  "avx2",
  "fma",
  "avx512f",
