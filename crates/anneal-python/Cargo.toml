[package]
name = "anneal-python"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "The anneal._core extension module, with the rgpot cluster kernels installed"
license = "MIT"
publish = false

[lib]
name = "anneal_python"
crate-type = ["cdylib"]

[features]
# maturin and CI pass `--features python`; the module is always the
# Python build of anneal-core.
python = []

[dependencies]
anneal-core = { path = "../..", features = ["python-host"] }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
rgpot-pair = { git = "https://github.com/OmniPotentRPC/rgpot", rev = "3aa8f9caf87dce22a5e1d74f4a06c9779d0c2212" }
