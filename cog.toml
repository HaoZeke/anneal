from_latest_tag = true
ignore_merge_commits = true
# Towncrier owns CHANGELOG.md. https://towncrier.readthedocs.io/en/stable/
disable_changelog = true
disable_bump_commit = false
generate_mono_repository_global_tag = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
# https://docs.cocogitto.io/
pre_bump_hooks = [
    "python3 scripts/bump_package_version.py {{version}}",
]
post_bump_hooks = [
    "python3 scripts/version_cog.py --check @scripts/cogfiles",
    "python3 scripts/check_version_sot.py",
]
pre_package_bump_hooks = []
post_package_bump_hooks = []
tag_prefix = "v"

[git_hooks]

[commit_types]
enh = { changelog_title = "Enhancements" }
bug = { changelog_title = "Bugfixes" }
maint = { changelog_title = "Maintenance" }
prj = { changelog_title = "Project" }
doc = { changelog_title = "Documentation" }
tst = { changelog_title = "Tests" }
bld = { changelog_title = "Buildsystem" }
gen = { changelog_title = "Generated" }
dat = { changelog_title = "Data" }
bench = { changelog_title = "Benchmarks" }
# A squash-merged develop-into-main pull request keeps its "merge:" title
# on a single-parent commit, so ignore_merge_commits does not skip it.
merge = { changelog_title = "Merges", omit_from_changelog = true }

[changelog]
path = "CHANGELOG.md"
authors = [
        { username = "HaoZeke", signature = "Rohit Goswami" }
]

[bump_profiles]
