[workspace]
name      = "anneal"
version   = "0.2.0"
description = "Simulated annealing components on the eindir typed primitives."
channels  = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[activation.env]
# Pixi inherits the host cargo config; the conda rust toolchain ships its
# own gcc which does not understand -fuse-ld=/usr/bin/mold. Clear inherited
# rustflags so the conda-managed linker is driven cleanly.
CARGO_BUILD_RUSTFLAGS = ""
RUSTFLAGS = ""

[tasks]
test     = "cargo test"
test-all = "cargo test --all-features"
bench    = "cargo bench"
build    = "cargo build --release"

[dependencies]
rust = ">=1.88"

[feature.python.dependencies]
python  = ">=3.10"
maturin = ">=1.5"
pytest  = "*"
pip     = "*"

[feature.python.tasks]
python-build = "maturin develop --features python"
python-test  = { cmd = "pytest pytest/", depends-on = ["python-build"] }

[feature.docs.dependencies]
python = ">=3.10"
emacs  = "*"
sphinx = ">=7,<9"
pandoc = ">=3.1,<4"

[feature.docs.pypi-dependencies]
shibuya                    = ">=2026.1.9, <2027"
sphinxcontrib-rust         = ">=1.0.0, <2"
sphinx-rustdoc-postprocess = ">=0.1.0, <0.2"

[feature.docs.tasks]
# --root $CONDA_PREFIX lands the binary at .pixi/envs/docs/bin/sphinx-rustdocgen
# so it is on PATH inside the docs env. Without this, cargo defaults to
# ~/.cargo/bin which is not on PATH for pixi-spawned shells.
setup-rustdocgen = "test -x $CONDA_PREFIX/bin/sphinx-rustdocgen || cargo install --root $CONDA_PREFIX sphinx-rustdocgen"
orgbld           = "emacs --batch -l docs/export.el"
docbld           = { cmd = "sphinx-build docs/source docs/build -b html", depends-on = ["orgbld", "setup-rustdocgen"] }

# verify env
#
# Bundles the verification toolchain that backs the IISE manuscript:
#   - sympy proofs runner (proofs/, pytest harness)
#   - TLA+ TLC model checker (downloaded as tla2tools.jar at first use)
#   - Apalache symbolic model checker (downloaded as a tarball at first use)
#
# Network: setup-tlc and setup-apalache pull JARs from the public
# nightly.tlapl.us / GitHub release CDNs. If the host blocks outbound
# HTTPS, both setup tasks fail and tlc-small/apalache-check fail with
# them. Pre-stage .verify/tla2tools.jar and .verify/apalache/ manually
# in that case (see tla/README.org).
#
# Aggregator: `pixi run -e verify all` smoke-runs every artefact:
#   proofs-test (pytest) -> proofs-derive (4 thm scripts) ->
#   tlc-small (TLC on small.cfg) -> apalache-check (apalache.cfg).
[feature.verify.dependencies]
python      = ">=3.11"
sympy       = "*"
pytest      = "*"
pytest-cov  = "*"
numpy       = ">=1.24"
openjdk     = ">=17"
curl        = "*"

[feature.verify.activation.env]
# Mirror the default env's empty rustflags so that any incidental cargo
# invocation under the verify env uses the conda-managed linker cleanly.
CARGO_BUILD_RUSTFLAGS = ""
RUSTFLAGS             = ""

[feature.verify.tasks]
setup-tlc       = "test -f .verify/tla2tools.jar || (mkdir -p .verify && curl -L -o .verify/tla2tools.jar https://nightly.tlapl.us/dist/tla2tools.jar)"
setup-apalache  = "test -x .verify/apalache/bin/apalache-mc || (mkdir -p .verify && curl -L https://github.com/apalache-mc/apalache/releases/download/v0.57.0/apalache.tgz | tar xz -C .verify && (test -d .verify/apalache || mv .verify/apalache-* .verify/apalache))"
proofs-test     = "pytest proofs/tests/ -v"
proofs-derive   = "PYTHONPATH=. python proofs/thm1_bsa_visit.py && PYTHONPATH=. python proofs/thm2_fsa_visit.py && PYTHONPATH=. python proofs/thm3_metropolis.py && PYTHONPATH=. python proofs/thm4_log_cool.py"
tlc-small       = { cmd = "java -cp .verify/tla2tools.jar tlc2.TLC tla/Workflow.tla -config tla/small.cfg -workers auto -depth 30", depends-on = ["setup-tlc"] }
apalache-check  = { cmd = ".verify/apalache/bin/apalache-mc check --config=tla/apalache.cfg --length=20 --inv=TypeOK tla/WorkflowApalache.tla", depends-on = ["setup-apalache"] }
exp-test        = "PYTHONPATH=. pytest experiments/tests/ -v"
exp1            = "PYTHONPATH=. python experiments/exp1_underflow.py --out data/exp1_underflow.csv --samples 200000"
exp2            = "PYTHONPATH=. python experiments/exp2_cancellation.py --out data/exp2_cancellation.csv"
exp3            = "PYTHONPATH=. python experiments/exp3_trajectory_bias.py --out data/exp3_trajectory.csv --seeds 32 --n-epochs 200"
exp4            = "PYTHONPATH=. python experiments/exp4_compensated.py --out data/exp4_compensated.csv --seeds 32 --n-epochs 200"
exp3-summary    = "PYTHONPATH=. python experiments/scripts/exp3_summary.py data/exp3_trajectory.csv"
all             = { depends-on = ["proofs-test", "proofs-derive", "tlc-small", "apalache-check"] }
all-exp         = { depends-on = ["exp-test", "exp1", "exp2", "exp3", "exp4", "exp3-summary"] }

[environments]
default = { solve-group = "default" }
python  = { features = ["python"], solve-group = "default" }
docs    = { features = ["docs"],   solve-group = "default" }
verify  = { features = ["verify"], solve-group = "default" }
