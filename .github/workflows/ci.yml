name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every feature a runner can satisfy that gates code today.
  # Linux jobs append `lammps`: `liblammps-dev` supplies the shared
  # library and `LAMMPS_LIB_DIR` is set when those dependencies are
  # built. macOS runners do not install it, so this list stays without
  # it. `gpr` stays out because `libgpr_optim` is not a package a
  # runner can fetch. `nng-transport` is excluded because it gates no
  # source at all yet and its dependency builds the nng C library
  # through cmake; put it back the day it does.
  CI_FEATURES: ira,graphkey,featomic,vesin-nl,bank-rpc,capi,python,rgpot-ex
  # The test profile keeps opt-level 2, debug assertions and overflow
  # checks. Full DWARF in the ~270 anneal-core test and example units
  # cost a third of their compile and link time and two thirds of the
  # feature target tree. Line tables keep file and line in panics and
  # backtraces. Every CI build starts from a cold workspace crate, so
  # incremental state is written and never read.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Select Python test runners
    runs-on: ubuntu-latest
    outputs:
      test-os: ${{ steps.matrix.outputs.test-os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            macos-python:
              - 'src/**'
              - 'python/**'
              - 'Cargo.*'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

      # Linux runs the Python matrix for every change. The macOS cells only
      # cover native/Python build inputs, so unrelated changes must not wait
      # for scarce macOS runners.
      - name: Build runner matrix
        id: matrix
        shell: bash
        run: |
          if [[ "${{ steps.paths.outputs['macos-python'] }}" == "true" ]]; then
            echo 'test-os=["ubuntu-latest","macos-15","macos-26"]' >> "$GITHUB_OUTPUT"
          else
            echo 'test-os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `vendor/nng` and `vendor/nng-sys` are workspace-excluded path
      # dependencies. `cargo fmt --all` still walks every path dependency,
      # and stable rustfmt rewrites that tree: its rustfmt.toml asks for
      # nightly options, and the `ignore` key is unstable on stable.
      # Format workspace members only. Do not reformat the vendored sources.
      # Every check after fmt runs whatever the checks before it reported, so
      # a red fmt does not hide a red clippy under a feature set. A step that
      # needs an earlier setup step runs only when that setup succeeded.
      # `!cancelled()` lets a cancelled, superseded run still stop.
      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo clippy (default features)
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings

      # The rgpot-ex examples load rgpot through libloading. They need no
      # native dependency, so they are linted here on their own.
      - name: cargo clippy (rgpot-ex)
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features rgpot-ex -- -D warnings

      # rgsaddle compiles rgsaddle 0.3.0 from crates.io and needs no native
      # library. `python` and `bank-rpc` turn it on, but alone it is a
      # feature set of its own.
      - name: cargo clippy (rgsaddle)
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features rgsaddle -- -D warnings

      # `cargo package` writes anneal-core-${version}.crate and verifies
      # it. The next step extracts that crate, drops the development
      # cargo config and the lockfile, and checks the default features
      # plus `rgsaddle,python` against crates.io.
      - name: Package the crate
        id: package
        if: ${{ !cancelled() }}
        run: cargo package

      - name: Check packaged default features against crates.io
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          meta=$(cargo metadata --format-version 1 --no-deps)
          read -r target version < <(python3 -c 'import json,sys; m=json.loads(sys.argv[1]); pkg=next(p for p in m["packages"] if p["name"]=="anneal-core"); print(m["target_directory"], pkg["version"])' "$meta")
          crate="${target}/package/anneal-core-${version}.crate"
          test -f "$crate"
          work=$(mktemp -d)
          tar -xzf "$crate" -C "$work"
          pkg=$(find "$work" -mindepth 1 -maxdepth 1 -type d)
          test -d "$pkg"
          rm -rf "$pkg/.cargo"
          rm -f "$pkg/Cargo.lock"
          (
            cd "$pkg"
            cargo generate-lockfile
            cargo check --locked
            cargo check --locked --features rgsaddle,python
          )

      - name: Checkout Vesin
        id: vesin
        if: ${{ !cancelled() }}
        uses: actions/checkout@v6
        with:
          repository: Luthaf/vesin
          ref: 5ac39b6e57a8f00c717f08c83f93ee4746d6e471
          path: .ci/vesin
          persist-credentials: false

      - name: Checkout IRA
        id: ira
        if: ${{ !cancelled() }}
        uses: actions/checkout@v6
        with:
          repository: mammasmias/IterativeRotationsAssignments
          ref: 2b2fc312569a5a50183ca82b2f260ebaaf87c508
          path: .ci/ira
          persist-credentials: false

      - name: Build all-feature dependencies
        id: feature-deps
        if: ${{ !cancelled() && steps.vesin.outcome == 'success' && steps.ira.outcome == 'success' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran liblapack-dev liblammps-dev
          cmake -S .ci/ira -B .ci/ira/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=gfortran
          cmake --build .ci/ira/build --parallel 2
          test -f .ci/ira/lib/libira.so
          test -f /usr/lib/x86_64-linux-gnu/liblammps.so
          echo "VESIN_SRC=$GITHUB_WORKSPACE/.ci/vesin" >> "$GITHUB_ENV"
          echo "IRA_LIB_DIR=$GITHUB_WORKSPACE/.ci/ira/lib" >> "$GITHUB_ENV"
          echo "LAMMPS_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.ci/ira/lib:${LD_LIBRARY_PATH:-}" \
            >> "$GITHUB_ENV"

      - name: cargo clippy
        if: ${{ !cancelled() && steps.feature-deps.outcome == 'success' }}
        run: cargo clippy --features "$CI_FEATURES,lammps" --all-targets -- -D warnings

      # `gpr` is linted with the rest. clippy type-checks and never links, so
      # an empty file stands in for libgpr_optim, which a runner cannot fetch;
      # build.rs only checks that the file is there.
      - name: cargo clippy (all features)
        if: ${{ !cancelled() && steps.feature-deps.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p .ci/gpr-optim
          : > .ci/gpr-optim/libgpr_optim.so
          GPR_OPTIM_LIB_DIR="$GITHUB_WORKSPACE/.ci/gpr-optim" \
            cargo clippy --all-targets --all-features -- -D warnings

      - name: Install Cocogitto
        id: cocogitto
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: cocogitto

      # 235683cf30fc3cff9d3be5f92ac26b5a046483e1 is the commit of #50 on
      # develop. Its subject, "cluster_hopping: reverse hydrogen-bond cycles
      # in rigid water (#50)", does not parse as a conventional commit, and
      # develop keeps it as it is. cog skips only merge and fixup commits,
      # so a range that holds this one is checked in two parts: up to its
      # parent, and from it to the tip. The second part also walks the
      # commits of the base branch that 235683cf does not reach.
      - name: Conventional commits check
        if: ${{ !cancelled() && steps.cocogitto.outcome == 'success' }}
        shell: bash
        env:
          COG_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COG_TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          COG_EXEMPT: 235683cf30fc3cff9d3be5f92ac26b5a046483e1
        run: |
          if [[ -z "$COG_FROM" || "$COG_FROM" =~ ^0+$ ]] || \
             ! git cat-file -e "$COG_FROM^{commit}"; then
            COG_FROM=$(git rev-parse "$COG_TO^")
          fi
          # The pull-request checkout does not have origin/develop. The
          # latest develop merge records that tip as its second parent. A
          # main base would otherwise re-check develop's history.
          develop_merge=$(git log -1 --format=%H --grep="Merge remote-tracking branch 'origin/develop'" "$COG_TO" || true)
          if [[ -n "$develop_merge" ]] \
             && git rev-parse --verify --quiet "${develop_merge}^2" >/dev/null \
             && ! git merge-base --is-ancestor "${develop_merge}^2" "$COG_FROM"; then
            COG_FROM=$(git rev-parse "${develop_merge}^2")
          fi
          if git merge-base --is-ancestor "$COG_EXEMPT" "$COG_TO" &&
             ! git merge-base --is-ancestor "$COG_EXEMPT" "$COG_FROM"; then
            status=0
            for range in "$COG_FROM..$COG_EXEMPT^" "$COG_EXEMPT..$COG_TO"; do
              # cog check A..A checks commit A, so an empty part is left out.
              count=$(git rev-list --count "$range")
              if ((count > 0)); then
                echo "cog check $range"
                cog check "$range" || status=1
              fi
            done
            exit "$status"
          fi
          cog check "$COG_FROM..$COG_TO"

      # A pull-request checkout is the merge of the base into the head, so
      # `git rev-list --objects HEAD` also lists blobs the base already has.
      # Those still fail a push of the base, which audits HEAD. A pull request
      # audits the objects its own commits add, at the same 1 MiB bar. The
      # blobs in .github/large-blobs.txt landed before the audit could run
      # and are skipped by object name.
      - name: Audit for large files
        if: ${{ !cancelled() }}
        shell: bash
        env:
          AUDIT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          AUDIT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$AUDIT_BASE" ]] && git cat-file -e "$AUDIT_BASE^{commit}" \
              && git cat-file -e "$AUDIT_HEAD^{commit}"; then
            range="$AUDIT_BASE..$AUDIT_HEAD"
          else
            range=HEAD
          fi
          if [[ "$range" == HEAD ]]; then
            objects=$(git rev-list --objects HEAD)
          else
            objects=$(git rev-list --objects "$range")
          fi
          if [[ -z "$objects" ]]; then
            oversized=
          else
            oversized=$(
              printf '%s\n' "$objects" |
                git cat-file --batch-check='%(objecttype) %(objectsize) %(objectname) %(rest)' |
                awk 'NR == FNR { if ($1 !~ /^#/) known[$1] = 1; next }
                     $1 == "blob" && $2 > 1048576 && !($3 in known)' .github/large-blobs.txt -
            )
          fi
          if [[ -n "$oversized" ]]; then
            printf 'Git history contains blobs larger than 1 MiB:\n%s\n' "$oversized" >&2
            exit 1
          fi

      # scripts/paper_audit.py recomputes every paper and bench-table number
      # from the committed rows and checks the revision each row cites. A
      # revision is resolved when a fetched remote ref contains it, when
      # bench/revision-aliases.csv verifies it, or when the recorded
      # code_tree matches a fetched tree. bench/unpushed-revisions.csv gives
      # the reason for each revision that stays unresolved. The audit exits
      # 2 when the checkout is shallow or an alias target is absent, and
      # exits 1 on drift or an unresolved revision with no reason.
      - name: Paper audit
        if: ${{ !cancelled() }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
          else
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          fi
          python3 scripts/paper_audit.py

  test:
    name: Test (${{ matrix.os }}, py ${{ matrix.python-version }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 jobs are cancelled in about a second by the runner-image
        # brownout. The image is retired on 2026-11-02; macos-26 replaces it.
        os: ${{ fromJSON(needs.changes.outputs.test-os) }}
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # pytest/test_paper_audit.py looks up the revision every committed row
      # cites, and checks that each entry of bench/revision-aliases.csv is
      # on a branch fetched from GitHub. A shallow clone has neither.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The feature build's anneal-core test and example binaries outgrow
      # the free disk an ubuntu-latest image guarantees.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: bash scripts/ci_free_disk.sh

      - name: Checkout Vesin
        uses: actions/checkout@v6
        with:
          repository: Luthaf/vesin
          ref: 5ac39b6e57a8f00c717f08c83f93ee4746d6e471
          path: .ci/vesin
          persist-credentials: false

      - name: Checkout IRA
        uses: actions/checkout@v6
        with:
          repository: mammasmias/IterativeRotationsAssignments
          ref: 2b2fc312569a5a50183ca82b2f260ebaaf87c508
          path: .ci/ira
          persist-credentials: false

      - name: Build all-feature dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gfortran liblapack-dev liblammps-dev
            test -f /usr/lib/x86_64-linux-gnu/liblammps.so
            echo "LAMMPS_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
            fortran=gfortran
            lapack=Generic
          else
            for candidate in gfortran gfortran-15 gfortran-14 gfortran-13; do
              if command -v "$candidate" >/dev/null 2>&1; then
                fortran=$candidate
                break
              fi
            done
            test -n "${fortran:-}"
            lapack=Apple
          fi
          cmake -S .ci/ira -B .ci/ira/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER="$fortran" \
            -DBLA_VENDOR="$lapack"
          cmake --build .ci/ira/build --parallel 2
          if [[ "$RUNNER_OS" == Linux ]]; then
            test -f .ci/ira/lib/libira.so
            echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.ci/ira/lib:${LD_LIBRARY_PATH:-}" \
              >> "$GITHUB_ENV"
          else
            test -f .ci/ira/lib/libira.dylib
            echo "DYLD_FALLBACK_LIBRARY_PATH=$GITHUB_WORKSPACE/.ci/ira/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}" \
              >> "$GITHUB_ENV"
          fi
          echo "VESIN_SRC=$GITHUB_WORKSPACE/.ci/vesin" >> "$GITHUB_ENV"
          echo "IRA_LIB_DIR=$GITHUB_WORKSPACE/.ci/ira/lib" >> "$GITHUB_ENV"

      # Restores third-party crates and the native libraries their build
      # scripts compile; anneal-core itself always rebuilds. The Python
      # cells of one OS share an entry: three feature entries instead of
      # twelve fit the repository's cache quota. pyo3-build-config reruns
      # when PATH names another interpreter, so a cell rebuilds only the
      # pyo3 crates. Pull requests read the entries that main and develop
      # pushes save.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ../tmp/anneal-target"
          key: features-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' }}

      # The default-feature suite runs once per OS in `test-default`.
      # Do not pass `-undefined dynamic_lookup` on macOS. It applies to the
      # test harness as well as the cdylib. With pyo3's `extension-module`
      # feature the harness does not link libpython, and dyld then fails
      # before any test with `_PyBaseObject_Type` missing in the flat
      # namespace. build.rs links libpython for this invocation. Maturin
      # still passes the lookup flag when it builds the wheel.
      - name: cargo test (all satisfiable features)
        if: runner.os != 'macOS'
        run: cargo test --features "$CI_FEATURES,lammps"

      - name: cargo test (all satisfiable features, macOS)
        if: runner.os == 'macOS'
        run: cargo test --features "$CI_FEATURES"

      # maturin develop builds the dev profile and cannot reuse the
      # opt-level 2 test artifacts. Drop the anneal-core test and example
      # binaries before the wheel; they are nearly all of the tree. The
      # third-party crates stay for rust-cache to save.
      - name: cargo clean -p anneal-core (before the wheel)
        if: runner.os != 'macOS'
        run: cargo clean -p anneal-core

      - name: Create virtualenv
        shell: bash
        run: python -m venv .venv

      # The array-API loss and setting tests skip without array-api-strict,
      # so the step stops here if it does not import. It asks only for numpy,
      # unpinned, so the main suite still runs on the newest numpy.
      - name: Install maturin + pytest + array-api-strict
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "maturin>=1.5,<2" pytest numpy scipy sympy array-api-strict
          .venv/bin/python -c "import array_api_strict"

      - name: maturin develop
        run: .venv/bin/python -m maturin develop --features python --pip-path .venv/bin/pip3

      - name: pytest
        run: .venv/bin/python -m pytest pytest/

      - name: Execute quickstart notebook (MyST source)
        if: runner.os != 'macOS' && matrix.python-version == '3.12'
        run: |
          .venv/bin/python -m pip install jupytext nbconvert nbclient ipykernel
          .venv/bin/python -m jupytext --to ipynb --execute --output - \
            examples/notebooks/01_quickstart.md > /dev/null

      # The tests that drive a real ChemFit Fitter skip without ChemFit. It
      # pins numpy<2.4, so it goes in only after the steps above have run on
      # the newest numpy. 3.1.1 speaks ask/tell and keeps the incumbent on
      # FitContext.opt_params. 4.0.0, the current release, speaks
      # evaluate/step and keeps it on FitContext.opt_context. main is
      # installed from git: at 2c2d58b it matches the 4.0.0 Fitter apart from
      # the README, and a later protocol change fails this step. The ChemFit
      # tests hold array-API rows too, so each step checks again that
      # array-api-strict imports after ChemFit has moved numpy.
      - name: pytest (ChemFit 3.1.1, ask/tell)
        run: |
          .venv/bin/python -m pip install "chemfit==3.1.1"
          .venv/bin/python -c "from chemfit.fitter import Fitter; assert hasattr(Fitter, 'tell')"
          .venv/bin/python -c "import array_api_strict"
          .venv/bin/python -m pytest pytest/test_chemfit*.py

      - name: pytest (ChemFit 4.0.0, evaluate/step)
        run: |
          .venv/bin/python -m pip uninstall --yes chemfit
          .venv/bin/python -m pip install "chemfit==4.0.0"
          .venv/bin/python -c "from chemfit.fitter import Fitter; assert hasattr(Fitter, 'step')"
          .venv/bin/python -c "from chemfit.fitter import FitContext; assert hasattr(FitContext, 'parameters')"
          .venv/bin/python -c "import array_api_strict"
          .venv/bin/python -m pytest pytest/test_chemfit*.py

      - name: pytest (ChemFit main, evaluate/step)
        run: |
          .venv/bin/python -m pip uninstall --yes chemfit
          .venv/bin/python -m pip install \
            "chemfit @ git+https://github.com/MSallermann/chemfit@main"
          .venv/bin/python -c "from chemfit.fitter import Fitter; assert hasattr(Fitter, 'step')"
          .venv/bin/python -c "import array_api_strict"
          .venv/bin/python -m pytest pytest/test_chemfit*.py

  # The default features pull in no pyo3 and link no Python, IRA, Vesin or
  # LAMMPS, so this suite is the same binary under every matrix Python.
  # It runs once per OS beside the feature cells instead of ahead of each
  # of them. It is not a subset of the feature run: the
  # `cfg(not(feature = ...))` fallbacks are compiled only here.
  test-default:
    name: Test default features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-26]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Free disk space
        if: runner.os == 'Linux'
        run: bash scripts/ci_free_disk.sh

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ../tmp/anneal-target"
          key: default-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' }}

      - name: cargo test
        run: cargo test

  # pip builds the release sdist from its own files only. Installing it in a
  # fresh virtualenv catches a path the sdist leaves out. pytest runs from
  # the checkout but imports the installed package: `python/` is not on the
  # path.
  sdist:
    name: Build and install the sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.5,<2"
          python -m maturin sdist --out dist

      - name: Install from the sdist
        shell: bash
        run: |
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install --upgrade pip
          .sdist-venv/bin/python -m pip install dist/anneal-*.tar.gz pytest

      - name: pytest against the installed sdist
        shell: bash
        run: |
          test "$(.sdist-venv/bin/python -c 'import anneal, os; print(os.path.relpath(anneal.__file__))')" \
            != python/anneal/__init__.py
          .sdist-venv/bin/python -m pytest pytest/test_cluster_search.py

  ffi-smoke:
    name: FFI smoke (linux + cargo-c + valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev valgrind libc6-dbg

      - name: Install cargo-c
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-c

      - name: Install cbindgen
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen

      - name: cargo cinstall (smoke)
        run: |
          mkdir -p staging
          cargo cinstall --release --prefix=/usr --destdir="$PWD/staging"

      - name: Show installed FFI artefacts
        run: |
          find staging -type f | sort

      - name: Resolve FFI install paths via pkg-config
        id: pcfg
        run: |
          set -euxo pipefail
          PCFILE="$(find staging -name 'anneal-core.pc' -print -quit)"
          test -n "$PCFILE"
          PCDIR="$(dirname "$PCFILE")"
          # cargo-c installs the .pc with the destdir-stripped prefix
          # (/usr). Recover absolute paths by overriding `prefix` via
          # PKG_CONFIG_SYSROOT_DIR which prepends the staging root.
          STAGING_ROOT="$PWD/staging"
          export PKG_CONFIG_PATH="$PCDIR"
          export PKG_CONFIG_SYSROOT_DIR="$STAGING_ROOT"
          CFLAGS_OUT="$(pkg-config --cflags anneal-core)"
          LIBS_OUT="$(pkg-config --libs anneal-core)"
          LIBDIR_OUT="$(pkg-config --variable=libdir anneal-core)"
          # Create unversioned .so symlink so the linker can resolve
          # `-lanneal_core` (cargo-c installs `libanneal_core.so.<ver>`
          # only).
          (
            cd "$LIBDIR_OUT"
            for f in libanneal_core.so.*; do
              [ -e "$f" ] || continue
              base="${f%.so.*}.so"
              [ -e "$base" ] || ln -s "$f" "$base"
            done
          )
          {
            echo "cflags=$CFLAGS_OUT"
            echo "libs=$LIBS_OUT"
            echo "libdir=$LIBDIR_OUT"
          } >> "$GITHUB_OUTPUT"

      - name: Build ffi_smoke against installed lib
        run: |
          set -euxo pipefail
          # shellcheck disable=SC2086
          cc -std=c99 -Wall -Wextra \
             ${{ steps.pcfg.outputs.cflags }} \
             tests/ffi_smoke.c \
             -Wl,-rpath,${{ steps.pcfg.outputs.libdir }} \
             ${{ steps.pcfg.outputs.libs }} \
             -o ffi_smoke
          ./ffi_smoke

      - name: valgrind ffi_smoke
        run: |
          set -euxo pipefail
          LD_LIBRARY_PATH="${{ steps.pcfg.outputs.libdir }}" valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --track-origins=yes \
            --error-exitcode=1 \
            ./ffi_smoke

  version-sot:
    name: Version source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cogapp
        run: python -m pip install 'cogapp==3.6.0' 'towncrier==26.9.0'

      # cog.toml is the cocogitto config, so the bare cog binary is not cogapp.
      # scripts/version_cog.py passes one shared prologue. https://nedbatchelder.com/code/cog/
      - name: cog --check
        run: python scripts/version_cog.py --check @scripts/cogfiles

      - name: Compare version strings
        run: python3 scripts/check_version_sot.py

      # https://towncrier.readthedocs.io/en/stable/
      - name: towncrier build --draft
        run: towncrier build --draft
