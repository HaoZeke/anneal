name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Release flow (abi3 wheels + towncrier changelog):
# - The tag name MUST be vX.Y.Z. A tag named 0.8.0 does not match
#   push.tags v* and does not publish to PyPI or crates.io.
# - Cargo.toml, pyproject.toml, and CITATION.cff versions must equal
#   the tag with the leading v stripped, or validate-release fails.
# - Cargo.toml enables abi3-py310: wheels job builds one wheel per
#   platform (no --find-interpreter, no per-Python matrix).
# - Release preparation: run `pixi r towncrier-build` after fragments are
#   merged so CHANGELOG.md is up to date under the marker.
# - GH Release uses --generate-notes (supplements the towncrier history).
# - Full steps: docs/orgmode/release.org

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          citation_version=$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' CITATION.cff)
          test "$cargo_version" = "$python_version"
          test "$cargo_version" = "$citation_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$cargo_version"
          fi

  native-libs:
    name: Native libs (${{ matrix.os }}, ${{ matrix.target }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: anneal-core-linux-x86_64
            static_lib: libanneal_core.a
            shared_lib: libanneal_core.so
          - os: macos
            runner: macos-14
            target: aarch64-apple-darwin
            artifact: anneal-core-macos-aarch64
            static_lib: libanneal_core.a
            shared_lib: libanneal_core.dylib
          # x86_64 mac is cross-compiled from the arm64 runner; the macos-13
          # x86_64 image is retired and queues forever.
          - os: macos
            runner: macos-14
            target: x86_64-apple-darwin
            artifact: anneal-core-macos-x86_64
            static_lib: libanneal_core.a
            shared_lib: libanneal_core.dylib

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cbindgen
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen

      - name: Build static + shared library
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate anneal-core --output anneal-core.h

      - name: Package artifacts
        run: |
          mkdir -p staging/include staging/lib
          cp anneal-core.h staging/include/
          cp include/anneal-core.hpp staging/include/
          cp target/${{ matrix.target }}/release/${{ matrix.static_lib }} staging/lib/
          cp target/${{ matrix.target }}/release/${{ matrix.shared_lib }} staging/lib/
          tar czf ${{ matrix.artifact }}.tar.gz -C staging .
          tar tzf ${{ matrix.artifact }}.tar.gz | grep -Fq "./include/anneal-core.h"
          tar tzf ${{ matrix.artifact }}.tar.gz | grep -Fq "./include/anneal-core.hpp"
          tar tzf ${{ matrix.artifact }}.tar.gz | grep -Fq "./lib/${{ matrix.static_lib }}"
          tar tzf ${{ matrix.artifact }}.tar.gz | grep -Fq "./lib/${{ matrix.shared_lib }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  sdist:
    name: Build sdist
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Validate sdist
        run: pipx run twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels (${{ matrix.os }}, ${{ matrix.target }})
    needs: validate-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-22.04
            target: aarch64
          - os: macos-14
            target: x86_64
          - os: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # abi3 enabled in Cargo.toml (pyo3 with "abi3-py310") produces a
          # single wheel per platform that works on all Python >=3.10.
          args: --release --out dist --features python
          manylinux: auto

      - name: Validate wheels
        if: matrix.target != 'aarch64' || runner.os != 'Linux'
        run: pipx run twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/anneal
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{sdist,wheels-*}'
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-crate:
    name: Publish anneal-core to crates.io
    needs: [native-libs]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if curl -fsS -A 'anneal-release-ci' "https://crates.io/api/v1/crates/anneal-core/${ver}" >/dev/null 2>&1; then
            echo "anneal-core ${ver} already on crates.io; nothing to upload."
            exit 0
          fi
          cargo publish --locked

  github-release:
    name: GitHub Release
    needs: [native-libs, sdist, wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz
