name: Python TSan

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory that contains the project to install
        required: true
        type: string
      import-names:
        description: Comma-separated extension modules
        required: true
        type: string
      test-path:
        description: Pytest path relative to package-dir
        required: true
        type: string
      extras:
        description: Extras to install with the package
        required: false
        type: string
        default: ""
      rust-crate-dir:
        description: Crate directory relative to package-dir. Empty means no Rust sanitizer build.
        required: false
        type: string
        default: ""
      rust-archive:
        description: Rust staticlib file name counted for __tsan_func_entry when rust-crate-dir is set.
        required: false
        type: string
        default: librust_core_demo.a
      tsan-cmake-args:
        description: CMake arguments for the TSan build. Empty by default.
        required: false
        type: string
        default: ""
      rust-toolchain:
        description: Rustup toolchain installed when rust-crate-dir is set.
        required: false
        type: string
        default: nightly-2026-01-20
      apt-packages:
        description: Space-separated apt packages installed inside the TSan image. Empty skips apt.
        required: false
        type: string
        default: ""
      setup-script:
        description: Repo-relative script to source instead of pip install of the package. Empty keeps pip install.
        required: false
        type: string
        default: ""
      images:
        description: JSON list of TSan images. Each object has name, image, and build_numpy. The default is numpy-tsan 3.14t, which already contains NumPy.
        required: false
        type: string
        default: '[{"name":"3.14t","image":"ghcr.io/nascheme/numpy-tsan:3.14t@sha256:f6dd658f1a155be35e27b182cac97c2a77c4b2d62bacb81753beaba725978149","build_numpy":"false"}]'
      pytest-args:
        description: Extra arguments appended to the pytest invocation.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tsan:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/')
      || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: T2 cpython_sanity ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lower vm.mmap_rnd_bits for TSan
        shell: bash
        run: |
          set -euo pipefail
          # /proc/sys/vm/mmap_rnd_bits is root-only on the Ubuntu 26.04
          # runner, so an unprivileged read cannot decide whether the
          # sysctl is needed. TSan's shadow layout needs at most 28 bits;
          # set it unconditionally and print what the kernel reports.
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo sysctl -n vm.mmap_rnd_bits

      - name: Pytest under ThreadSanitizer
        shell: bash
        env:
          PKG: ${{ inputs.package-dir }}
          TEST_PATH: ${{ inputs.test-path }}
          IMPORTS: ${{ inputs.import-names }}
          EXTRAS: ${{ inputs.extras }}
          RUST_CRATE: ${{ inputs.rust-crate-dir }}
          RUST_ARCHIVE: ${{ inputs.rust-archive }}
          TSAN_CMAKE_ARGS: ${{ inputs.tsan-cmake-args }}
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
          APT_PACKAGES: ${{ inputs.apt-packages }}
          SETUP_SCRIPT: ${{ inputs.setup-script }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
          IMAGE: ${{ matrix.target.image }}
          BUILD_NUMPY: ${{ matrix.target.build_numpy }}
          BOOTSTRAP_CPYTHON: ${{ matrix.target.bootstrap }}
        run: |
          set -euo pipefail
          # The image tag is pinned by digest. Mount the tree at /src.
          # /work holds the image's pyenv install. numpy-tsan already
          # contains NumPy. cpython-tsan does not, so build_numpy compiles
          # it with the same sanitizer flags as the extension.
          if [ -z "${IMAGE}" ]; then
            echo "TSan image is empty" >&2
            exit 1
          fi
          tsan_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/py-tsan.XXXXXX")"
          trap 'rm -rf "${tsan_dir}"' EXIT
          cat > "${tsan_dir}/run.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          trap 'chmod -R a+rwX /tsan-host 2>/dev/null || true' EXIT
          if [ -n "${BOOTSTRAP_CPYTHON:-}" ]; then
            # cpython-tsan:3.13t lists an amd64 manifest the registry does
            # not serve. Build that interpreter here instead. Install llvm
            # so llvm-symbolizer is on PATH and TSan suppressions match.
            bash /src/ci/gha/apt-install.sh build-essential clang llvm git pkg-config libffi-dev libssl-dev \
              libjpeg-dev zlib1g-dev libsqlite3-dev libbz2-dev liblzma-dev libreadline-dev ca-certificates curl xz-utils
            curl -fsSL -o /tmp/cpython.tar.gz \
              "https://github.com/python/cpython/archive/refs/tags/v${BOOTSTRAP_CPYTHON}.tar.gz"
            rm -rf "/tmp/cpython-${BOOTSTRAP_CPYTHON}"
            tar -C /tmp -xzf /tmp/cpython.tar.gz
            (
              cd "/tmp/cpython-${BOOTSTRAP_CPYTHON}"
              CC=clang CXX=clang++ ./configure \
                --prefix=/opt/python-tsan \
                --disable-gil \
                --with-thread-sanitizer \
                --with-ensurepip=install
              make -j"$(nproc)"
              make install
            )
            export PATH="/opt/python-tsan/bin:${PATH}"
          fi
          if command -v python >/dev/null 2>&1; then
            PY=python
          elif command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            echo "python not on PATH" >&2
            exit 1
          fi
          "$PY" -c 'import sys; print(sys.version); print("gil", sys._is_gil_enabled())'
          if ! command -v "${CXX:-clang++}" >/dev/null 2>&1 && ! command -v clang++ >/dev/null 2>&1; then
            bash /src/ci/gha/apt-install.sh clang
          fi
          if ! command -v curl >/dev/null 2>&1; then
            bash /src/ci/gha/apt-install.sh ca-certificates curl
          fi
          export CC="${CC:-clang}"
          export CXX="${CXX:-clang++}"
          export CFLAGS="${CFLAGS:-} -fsanitize=thread -fno-omit-frame-pointer -g -ffp-contract=off"
          export CXXFLAGS="${CXXFLAGS:-} -fsanitize=thread -fno-omit-frame-pointer -g -ffp-contract=off"
          export LDFLAGS="${LDFLAGS:-} -fsanitize=thread"
          export PIP_BREAK_SYSTEM_PACKAGES=1
          if [ -n "${APT_PACKAGES}" ]; then
            # shellcheck disable=SC2086
            bash /src/ci/gha/apt-install.sh ${APT_PACKAGES}
          fi
          if [ -n "${RUST_CRATE}" ]; then
            if [ ! -f "/src/${PKG}/${RUST_CRATE}/Cargo.toml" ]; then
              echo "missing Rust crate /src/${PKG}/${RUST_CRATE}/Cargo.toml" >&2
              exit 1
            fi
            if ! command -v git >/dev/null 2>&1; then
              bash /src/ci/gha/apt-install.sh git ca-certificates
            fi
            # LLVM 21 nightly. rustc moved to LLVM 22 on 2026-01-28, and the
            # image clang is LLVM 21. The dated toolchain keeps the majors equal.
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            # shellcheck disable=SC1091
            source "${HOME}/.cargo/env"
            rustup toolchain install "${RUST_TOOLCHAIN}" --component rust-src --profile minimal
            rustup default "${RUST_TOOLCHAIN}"
            cxx="${CXX}"
            clang_major="$("$cxx" -dM -E -x c /dev/null | awk '/^#define __clang_major__ / { print $3 }')"
            rust_major="$(rustc -vV | awk '/^LLVM version:/ { split($3, a, "."); print a[1] }')"
            echo "clang version: $("$cxx" --version | head -n 1)"
            echo "rustc version: $(rustc -vV | awk '/^rustc / { print; exit }')"
            echo "clang LLVM major ${clang_major}"
            echo "rustc LLVM major ${rust_major}"
            if [ -z "${clang_major}" ] || [ -z "${rust_major}" ] || [ "${clang_major}" != "${rust_major}" ]; then
              echo "clang and rustc LLVM majors differ" >&2
              exit 1
            fi
          fi
          "$PY" -m pip install -U pip
          "$PY" -m pip install nanobind scikit-build-core cmake ninja pytest pytest-timeout pytest-run-parallel
          # Hypothesis 6.156+ is a PyO3 extension. PyO3 does not build on
          # free-threaded 3.13, and that tag has no cp313t wheel.
          if "$PY" -c 'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 13) else 1)'; then
            "$PY" -m pip install 'hypothesis>=6,<6.156'
          else
            "$PY" -m pip install hypothesis
          fi
          if [ "${BUILD_NUMPY:-false}" = "true" ]; then
            bash /src/ci/gha/apt-install.sh pkg-config
            "$PY" -m pip install 'numpy>=2' --no-binary=numpy -Csetup-args=-Dallow-noblas=true
          elif ! "$PY" -c 'import numpy' >/dev/null 2>&1; then
            "$PY" -m pip install 'numpy>=1.24'
          fi
          spec="/src/${PKG}"
          cmake_args="${TSAN_CMAKE_ARGS}"
          install_args=(--no-build-isolation --no-deps)
          if [ -n "${RUST_CRATE}" ]; then
            if [ -n "${cmake_args}" ]; then
              cmake_args="${cmake_args} -DRust_TOOLCHAIN=${RUST_TOOLCHAIN}"
            else
              cmake_args="-DRust_TOOLCHAIN=${RUST_TOOLCHAIN}"
            fi
            install_args+=(--config-settings=build-dir=/tmp/rust-tsan-build)
          fi
          if [ -n "${cmake_args}" ]; then
            export CMAKE_ARGS="${cmake_args}"
          fi
          if [ -n "${SETUP_SCRIPT}" ]; then
            export ROOT=/src
            # shellcheck disable=SC1090
            source "/src/${SETUP_SCRIPT}"
          else
            "$PY" -m pip install "${install_args[@]}" "${spec}"
          fi
          if [ -n "${RUST_CRATE}" ]; then
            if ! command -v nm >/dev/null 2>&1; then
              bash /src/ci/gha/apt-install.sh binutils
            fi
            found=0
            total=0
            if [ -z "${RUST_ARCHIVE}" ]; then
              echo "rust-archive is empty" >&2
              exit 1
            fi
            echo "Rust staticlib name ${RUST_ARCHIVE}"
            while IFS= read -r archive; do
              [ -n "${archive}" ] || continue
              found=1
              count="$(nm -A "${archive}" | grep -c __tsan_func_entry || true)"
              echo "__tsan_func_entry count ${count} in ${archive}"
              total=$((total + count))
            done < <(find /tmp/rust-tsan-build -name "${RUST_ARCHIVE}" -type f)
            if [ "${found}" -eq 0 ]; then
              echo "${RUST_ARCHIVE} not found under /tmp/rust-tsan-build" >&2
              find /tmp/rust-tsan-build -name '*.a' -type f >&2 || true
              exit 1
            fi
            if [ "${total}" -eq 0 ]; then
              echo "Rust staticlib has no __tsan_func_entry" >&2
              exit 1
            fi
          fi
          SUP=/tmp/suppressions_free_threading.txt
          curl -fsSL -o "${SUP}" \
            https://raw.githubusercontent.com/python/cpython/bf397e272c2bee639c3ba0208c221f7dd9447bb6/Tools/tsan/suppressions_free_threading.txt
          if [ -n "${BOOTSTRAP_CPYTHON:-}" ] && [ -f "/tmp/cpython-${BOOTSTRAP_CPYTHON}/Tools/tsan/suppressions_free_threading.txt" ]; then
            cat "/tmp/cpython-${BOOTSTRAP_CPYTHON}/Tools/tsan/suppressions_free_threading.txt" >> "${SUP}"
          fi
          if "$PY" -c 'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 13) else 1)'; then
            # CPython 3.13's intern_common adjusts refcounts and interned state
            # after PyDict_SetDefaultRef without LOCK_INTERNED (added in 3.14).
            printf '\nrace:intern_common\n' >> "${SUP}"
          fi
          if [ -f /work/tsan_suppressions/numpy.txt ]; then
            cat /work/tsan_suppressions/numpy.txt >> "${SUP}"
          else
            curl -fsSL \
              https://raw.githubusercontent.com/numpy/numpy/30483388e8c07f1abd45b47c534801e9207d2643/tools/ci/tsan_suppressions.txt \
              >> "${SUP}"
          fi
          # Upstream suppressions, pinned to commits rather than moving branches:
          # https://github.com/python/cpython/blob/bf397e272c2bee639c3ba0208c221f7dd9447bb6/Tools/tsan/suppressions_free_threading.txt
          # https://github.com/numpy/numpy/blob/30483388e8c07f1abd45b47c534801e9207d2643/tools/ci/tsan_suppressions.txt
          if [ -n "${BOOTSTRAP_CPYTHON:-}" ] && ! command -v llvm-symbolizer >/dev/null 2>&1; then
            for sym in /usr/lib/llvm-*/bin/llvm-symbolizer; do
              if [ -x "${sym}" ]; then
                export PATH="$(dirname "${sym}"):${PATH}"
                break
              fi
            done
          fi
          export OPENBLAS_NUM_THREADS=1
          export TSAN_OPTIONS="halt_on_error=1 allocator_may_return_null=1 suppressions=${SUP}"
          mapfile -t extra_args < <("$PY" -c 'import os, shlex; [print(p) for p in shlex.split(os.environ.get("PYTEST_ARGS", ""))]')
          "$PY" -m pytest -s "/src/${PKG}/${TEST_PATH}" \
            --junitxml=/tsan-host/pytest-serial.xml \
            "${extra_args[@]}" \
            --timeout=180 \
            -o faulthandler_timeout=120
          "$PY" -m pytest -s "/src/${PKG}/${TEST_PATH}" \
            --junitxml=/tsan-host/pytest-parallel.xml \
            --parallel-threads=4 \
            --iterations=5 \
            "${extra_args[@]}" \
            --timeout=180 \
            -o faulthandler_timeout=120
          EOF
          chmod +x "${tsan_dir}/run.sh"
          # TSan re-executes with ASLR disabled when the layout still
          # clashes; the default seccomp profile blocks that personality
          # call inside the container. Run the mounted script instead of
          # bash -s so child builds inside the container cannot consume stdin.
          docker run --rm \
            --security-opt seccomp=unconfined \
            -e PKG -e TEST_PATH -e IMPORTS -e EXTRAS -e RUST_CRATE -e RUST_ARCHIVE -e TSAN_CMAKE_ARGS -e RUST_TOOLCHAIN \
            -e APT_PACKAGES -e SETUP_SCRIPT -e PYTEST_ARGS -e BUILD_NUMPY -e BOOTSTRAP_CPYTHON \
            -v "$GITHUB_WORKSPACE":/src \
            -v "${tsan_dir}":/tsan-host \
            -w /src \
            "$IMAGE" \
            bash /tsan-host/run.sh
          python3 - "${tsan_dir}/pytest-serial.xml" "${tsan_dir}/pytest-parallel.xml" << 'PY'
          import sys
          import xml.etree.ElementTree as ET

          for report in sys.argv[1:]:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              if not suites:
                  raise SystemExit(f"{report}: no testsuite element found")
              ran = sum(int(s.attrib.get("tests", "0")) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", "0")) for s in suites)
              errors = sum(int(s.attrib.get("errors", "0")) for s in suites)
              failures = sum(int(s.attrib.get("failures", "0")) for s in suites)
              print(f"{report}: tests={ran} skipped={skipped} errors={errors} failures={failures}")
              if ran <= 0 or ran <= skipped:
                  raise SystemExit(
                      f"{report}: pytest did not execute non-skipped tests (tests={ran}, skipped={skipped})"
                  )
              if errors or failures:
                  raise SystemExit(f"{report}: pytest reported errors={errors} failures={failures}")
          PY
