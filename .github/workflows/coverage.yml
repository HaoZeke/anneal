# Multi-language coverage for Codecov (rust / cpp / python / fortran).
#
# Live dashboard: https://app.codecov.io/gh/OmniPotentRPC/rgpot
#
# Auth: Codecov GitHub App OIDC (use_oidc: true). Optional CODECOV_TOKEN for
# accounts that still use upload tokens. fail_ci_if_error only covers the
# uploader CLI. The action's OIDC token step throws before that, so a token
# request timeout fails the step after coverage was generated. Each upload
# continues on error, then retries with the repository token.
# fail_ci_if_error: false soft-fails a CLI error. The token retry does not
# continue on error, so an action failure there fails the upload job.
# Generation is a separate job and fails when tests or capture fail.

name: Coverage

on:
  push:
    branches: [main, ci/coverage]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PIXi_VERSION: v0.70.2

jobs:
  coverage-rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    name: rust coverage
    strategy:
      matrix:
        llvm-version: [20]
    env:
      CC: clang-${{ matrix.llvm-version }}
      CXX: clang++-${{ matrix.llvm-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm-version }}
          bash ci/gha/apt-install.sh --no-install-recommends clang-${{ matrix.llvm-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXi_VERSION }}
          cache: true
          environments: devbld
          activate-environment: true

      - name: Structural Codecov config gate
        run: bash scripts/check_codecov_config.sh

      - name: Generate rust coverage
        run: |
          unset RUSTC_WRAPPER || true
          # capnp for --all-features rpc
          bash scripts/run_coverage_rust.sh lcov.info rust_codecov.json
          test -s lcov.info

      - name: Upload rust coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: |
            lcov.info
            rust_codecov.json
          if-no-files-found: error

  coverage-cpp:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    name: cpp coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install lcov + gfortran
        run: |
          bash ci/gha/apt-install.sh --no-install-recommends lcov gfortran

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXi_VERSION }}
          cache: true
          environments: devbld
          activate-environment: true

      - name: Generate C++ (Meson) coverage
        env:
          RGPOT_COV_BUILDDIR: bbdir-cov
        run: |
          RGPOT_COV_TIMEOUT_MULTIPLIER=4 \
            bash scripts/run_coverage_cpp.sh cpp_lcov.info
          test -s cpp_lcov.info
          # Fortran kernel hits from the same tree (the pot tests drive them)
          bash scripts/run_coverage_fortran.sh fortran_lcov.info
          test -s fortran_lcov.info
          ls -la cpp_lcov.info fortran_lcov.info

      - name: Upload cpp coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cpp
          path: |
            cpp_lcov.info
            fortran_lcov.info
          if-no-files-found: error

  coverage-python:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    name: python coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXi_VERSION }}
          cache: true
          environments: rpctest
          activate-environment: true

      - name: Generate python coverage
        run: |
          bash scripts/run_coverage_python.sh python_coverage.xml
          test -s python_coverage.xml
          head -c 400 python_coverage.xml; echo

      - name: Upload python coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: python_coverage.xml
          if-no-files-found: error

  # Dedicated fortran path when the cpp job skipped the kernels; no-op if already uploaded.
  coverage-fortran:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    name: fortran coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gfortran + lcov
        run: |
          bash ci/gha/apt-install.sh --no-install-recommends gfortran lcov

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXi_VERSION }}
          cache: true
          environments: devbld
          activate-environment: true

      - name: Generate Fortran kernel coverage
        env:
          RGPOT_COV_BUILDDIR: bbdir-cov
        run: |
          # The meson tree is required: the kernels build inside it.
          if [[ ! -d bbdir-cov ]]; then
            bash scripts/run_coverage_cpp.sh /tmp/cpp_for_fort.info
          fi
          bash scripts/run_coverage_fortran.sh fortran_lcov.info
          test -s fortran_lcov.info
          grep -E '^(SF:|DA:)' fortran_lcov.info | head -15

      - name: Upload fortran coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-fortran
          path: fortran_lcov.info
          if-no-files-found: error

  # Upload runs only on push to main: the OIDC token (id-token: write) exists in
  # no other job, and pull_request runs stay read-only.
  codecov-upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    name: codecov upload
    needs: [coverage-rust, coverage-cpp, coverage-python, coverage-fortran]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: cov

      - name: Upload rust coverage to Codecov
        id: codecov-rust
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-rust/lcov.info,cov/coverage-rust/rust_codecov.json
          flags: rust
          name: rgpot-rust
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload rust coverage with the repository token
        if: steps.codecov-rust.outcome == 'failure'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-rust/lcov.info,cov/coverage-rust/rust_codecov.json
          flags: rust
          name: rgpot-rust
          use_oidc: false
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload cpp coverage to Codecov
        id: codecov-cpp
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-cpp/cpp_lcov.info
          flags: cpp
          name: rgpot-cpp
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload cpp coverage with the repository token
        if: steps.codecov-cpp.outcome == 'failure'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-cpp/cpp_lcov.info
          flags: cpp
          name: rgpot-cpp
          use_oidc: false
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload python coverage to Codecov
        id: codecov-python
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-python/python_coverage.xml
          flags: python
          name: rgpot-python
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload python coverage with the repository token
        if: steps.codecov-python.outcome == 'failure'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-python/python_coverage.xml
          flags: python
          name: rgpot-python
          use_oidc: false
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload fortran coverage to Codecov
        id: codecov-fortran
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-fortran/fortran_lcov.info
          flags: fortran
          name: rgpot-fortran
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload fortran coverage with the repository token
        if: steps.codecov-fortran.outcome == 'failure'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-fortran/fortran_lcov.info
          flags: fortran
          name: rgpot-fortran
          use_oidc: false
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
